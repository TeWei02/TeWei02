name: Daily Commit

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append today's activity
        run: |
          mkdir -p activity
          FILE="activity/daily-activity.md"
          if [ ! -f "$FILE" ]; then
            printf '# Daily Activity\n\n' > "$FILE"
          fi
          echo "- $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$FILE"
          git add "$FILE"

      - name: Commit and push
        run: |
          git config user.name "TeWei02"
          git config user.email "229563995+TeWei02@users.noreply.github.com"
          git commit -m "chore: daily activity $(date -u '+%Y-%m-%d')"
          git push
