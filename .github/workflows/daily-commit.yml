name: Daily Commit

on:
  schedule:
    - cron: '3 0 * * *'
    - cron: '17 1 * * *'
    - cron: '31 2 * * *'
    - cron: '47 3 * * *'
    - cron: '9 4 * * *'
    - cron: '23 5 * * *'
    - cron: '37 6 * * *'
    - cron: '51 7 * * *'
    - cron: '5 8 * * *'
    - cron: '19 9 * * *'
    - cron: '33 10 * * *'
    - cron: '49 11 * * *'
    - cron: '2 12 * * *'
    - cron: '16 13 * * *'
    - cron: '28 14 * * *'
    - cron: '42 15 * * *'
    - cron: '54 16 * * *'
    - cron: '7 17 * * *'
    - cron: '21 18 * * *'
    - cron: '35 19 * * *'
    - cron: '44 20 * * *'
    - cron: '58 21 * * *'
    - cron: '12 22 * * *'
    - cron: '26 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "TeWei02"
          git config user.email "229563995+TeWei02@users.noreply.github.com"

      - name: Update activity file
        run: |
          mkdir -p activity
          file="activity/daily-activity.md"
          if [ ! -f "$file" ]; then
            echo "# Daily Activity" > "$file"
            echo "" >> "$file"
          fi
          echo "- $(date -u +'%Y-%m-%d %H:%M:%S UTC') · $(date -u +'%A') · Day $(date -u +'%j')" >> "$file"

      - name: Commit and push
        run: |
          git add activity/daily-activity.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: hourly activity update $(date -u +'%Y-%m-%d') ($(date -u +'%A')) $(date -u +'%H:%M') UTC"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
